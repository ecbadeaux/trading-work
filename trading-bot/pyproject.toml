[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot"
version = "0.1.0"
description = "Alpaca-based trading bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.43",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
trading-bot = "trading_bot.main:main"
trading-bot-backtest = "trading_bot.backtest.cli:main"
trading-bot-download = "trading_bot.data.download:main"
trading-bot-walkforward = "trading_bot.backtest.walkforward:main"
trading-bot-ledger = "trading_bot.backtest.ledger:main"
trading-bot-ticks = "trading_bot.backtest.tickplan:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # Raised inside alpaca-py's dependency on websockets; not ours to fix.
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
